name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --all-features --locked --verbose

      - name: Run tests
        run: cargo test --workspace --lib --all-features --locked --verbose

  workspace:
    name: Workspace All Targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test workspace all targets
        run: cargo test --workspace --all-targets --all-features --locked --verbose

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      # This job compiles every target from scratch on a non-cached toolchain,
      # which makes it the heaviest in CI. At the runner's default parallelism
      # it has been dying mid-compile with SIGTERM (exit 143) and no diagnostic
      # — the signature of the runner running out of memory, not of a build
      # failure. Capping concurrent rustc invocations lowers the peak at the
      # cost of some wall time.
      - name: Test workspace on MSRV
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace --all-targets --all-features --locked --verbose

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test without default features
        run: cargo test --workspace --all-targets --no-default-features --locked --verbose

      - name: Check examples
        run: cargo check --workspace --examples --all-features --locked --verbose

      - name: Check benchmarks
        run: cargo check --workspace --benches --all-features --locked --verbose

      # The chat surface is large enough that a regression in it disappears into
      # the full suite's output. Running it as its own step names the failure.
      - name: Chat gate
        run: |
          set -eu
          cargo test --locked --lib -- components::chat::
          cargo test --locked \
            --test chat_composer \
            --test chat_conversation_contracts \
            --test chat_message_view \
            --test chat_message_views \
            --test chat_targeted_updates \
            --test message_list_properties \
            --test message_list_public_api \
            --test golden_real_apps

      # Built, not just type-checked: an example that compiles but fails to link
      # is not a runnable example, and these are the ones users copy from.
      - name: Build chat examples
        run: |
          set -eu
          cargo build --locked --all-features \
            --example chat \
            --example rnk_chat \
            --example claude_input_box \
            --example inline_chat_scrollback \
            --example fullscreen_chat_shell

      # Deterministic, no terminal assumptions, and they assert their own
      # invariants — so a wrong answer fails the build rather than printing one.
      - name: Run deterministic chat examples
        run: |
          set -eu
          cargo run --locked --all-features --example inline_chat_scrollback > /dev/null
          cargo run --locked --all-features --example fullscreen_chat_shell > /dev/null

      - name: Check package contents
        run: |
          set -eu
          package_list="$(mktemp)"
          cargo package --list -p rnk --locked > "$package_list"
          if grep -E '^(AGENTS\.md|CLAUDE\.md|docs/|\.github/|\.claude/)' "$package_list"; then
            echo "Unexpected agent-facing, docs, or workflow files in rnk package" >&2
            exit 1
          fi
          if grep -nE '\]\((docs/|examples/)' README.md; then
            echo "README uses package-relative docs/examples links that may break on crates.io" >&2
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Run Clippy
        run: >
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings
          -A clippy::collapsible_if
          -A clippy::manual_is_multiple_of

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run doc tests
        run: cargo test --doc --workspace --all-features --locked --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage
        # trybuild's cold compile-fail fixture can be silent for more than 60 seconds.
        run: cargo tarpaulin --workspace --all-features --out Xml --timeout 300 --locked

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: miri

      - name: Run focused Miri tests
        run: cargo miri test --lib -- layout::measure

  gh68:
    name: GH68 Current Head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH68_BASE_MAIN_SHA: e1d987447141b35d8049f8bd8ff89b2015ae87b9
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install pinned branch-coverage Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Bind exact head and ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          git merge-base --is-ancestor "$GH68_BASE_MAIN_SHA" "$actual_head"
          printf 'GH68_IMPLEMENTATION_HEAD=%s\n' "$actual_head" >> "$GITHUB_ENV"

      - name: Discover and build every indexed public example
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gh68-examples.txt" <<'PY'
          import json, re, sys
          from pathlib import Path
          source = Path("examples/README.md").read_text(encoding="utf-8")
          names = re.findall(r"^- `([^`]+\.rs)`(?::|$)", source, re.MULTILINE)
          if len(names) != len(set(names)):
              raise SystemExit("duplicate public example classification")
          actual = sorted(path.name for path in Path("examples").glob("*.rs"))
          if sorted(names) != actual:
              raise SystemExit(f"example index drift: indexed={sorted(names)!r} actual={actual!r}")
          if "glm_chat.rs" not in names:
              raise SystemExit("glm_chat.rs is not in the public example ledger")
          manifest_line = next(line for line in source.split("gh68-public-chat-examples-v1", 1)[1].splitlines() if line.startswith("{"))
          manifest = json.loads(manifest_line)
          if set(manifest) != {"schema", "records"} or manifest["schema"] != "gh68-public-chat-examples-v1":
              raise SystemExit("invalid GH68 example record schema")
          records = manifest["records"]
          expected = {"chat.rs", "rnk_chat.rs", "claude_input_box.rs", "glm_chat.rs"}
          categories = {"tutorial", "showcase", "debug", "internal"}
          modes = {"offline_inline", "interactive_fullscreen", "interactive_inline", "provider_inline"}
          readers = {"new_chat_user", "fullscreen_app_author", "inline_app_author", "provider_integrator"}
          if len(records) != 4 or {item.get("example") for item in records} != expected:
              raise SystemExit("GH68 example records are not the exact four-example set")
          for item in records:
              if set(item) != {"example", "category", "purpose", "runtime_mode", "target_reader"}:
                  raise SystemExit("GH68 example record has unknown or missing fields")
              if item["category"] not in categories or item["runtime_mode"] not in modes or item["target_reader"] not in readers or not item["purpose"].strip():
                  raise SystemExit("GH68 example record has an out-of-contract value")
          Path(sys.argv[1]).write_text("\n".join(names) + "\n", encoding="utf-8")
          PY
          while IFS= read -r file; do
            cargo build --locked --all-features --example "${file%.rs}"
          done < "$RUNNER_TEMP/gh68-examples.txt"

      - name: Produce pinned-nightly current-head branch coverage
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-01-18 llvm-cov --test golden_real_apps \
            --all-features --locked --branch --json \
            --output-path "$RUNNER_TEMP/gh68-coverage-raw.json"

      - name: Derive closed GH68 coverage summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gh68-coverage-raw.json" \
            "$RUNNER_TEMP/gh68-coverage.json" "$GH68_IMPLEMENTATION_HEAD" \
            "$GH68_BASE_MAIN_SHA" <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          raw_path, output_path, head, base = map(Path, sys.argv[1:])
          head, base = str(head), str(base)
          if not re.fullmatch(r"[0-9a-f]{40}", head) or not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("invalid head/base binding")
          raw_bytes = raw_path.read_bytes()
          report = json.loads(raw_bytes)["data"]
          if len(report) != 1:
              raise SystemExit("ambiguous llvm-cov report")
          functions = report[0]["functions"]
          root = Path.cwd().resolve()
          test_file = "tests/golden_real_apps.rs"
          tasks = Path("specs/GH68/tasks.md").read_text(encoding="utf-8")
          manifest_line = next(line for line in tasks.split("gh68-critical-paths-v1", 1)[1].splitlines() if line.startswith("{"))
          critical_manifest = json.loads(manifest_line)["critical_paths"]
          names = [item["name"] for item in critical_manifest]
          if len(names) != 15 or len(set(names)) != 15 or any(item["file"] != test_file for item in critical_manifest):
              raise SystemExit("critical manifest is not the closed 15-item set")

          def normalized_files(function):
              return [os.path.relpath(os.path.normpath(path), root) for path in function.get("filenames", [])]

          def interval_lines(start, end):
              last = end[0] if end[1] > 1 else end[0] - 1
              return range(start[0], last + 1)

          def region_line_counts(function, file_id=0):
              regions = []
              for raw in function.get("regions", []):
                  if len(raw) < 6 or raw[5] != file_id or (len(raw) > 7 and raw[7] != 0):
                      continue
                  start, end = (raw[0], raw[1]), (raw[2], raw[3])
                  if start >= end or not isinstance(raw[4], int) or raw[4] < 0:
                      raise SystemExit("invalid LLVM region counter")
                  regions.append((start, end, raw[4]))
              points = sorted({point for start, end, _ in regions for point in (start, end)})
              lines = {}
              for start, end in zip(points, points[1:]):
                  active = [region for region in regions if region[0] <= start and region[1] >= end]
                  if not active:
                      continue
                  effective = max(active, key=lambda region: (region[0], -region[1][0], -region[1][1]))
                  for line in interval_lines(start, end):
                      lines.setdefault(line, []).append(effective[2])
              return lines

          def line_totals(function):
              lines = region_line_counts(function)
              return sum(any(value > 0 for value in counts) for counts in lines.values()), len(lines)

          synthetic = {"regions": [[1, 1, 5, 1, 1, 0, 0, 0], [3, 1, 4, 1, 0, 0, 0, 0]]}
          if line_totals(synthetic) != (3, 4):
              raise SystemExit("LLVM nested-region precedence self-check failed")

          def branch_totals(function, selected_lines=None, file_id=0):
              covered = total = 0
              for branch in function.get("branches", []):
                  if (len(branch) < 6
                          or (len(branch) > 6 and branch[6] != file_id)
                          or (selected_lines is not None and branch[0] not in selected_lines)):
                      continue
                  reported_true_count, false_execution_count = branch[4], branch[5]
                  if (not isinstance(reported_true_count, int)
                          or not isinstance(false_execution_count, int)
                          or reported_true_count < 0 or false_execution_count < 0):
                      raise SystemExit("invalid LLVM branch counters")
                  execution_count = reported_true_count + false_execution_count
                  true_count = execution_count - false_execution_count
                  total += 2
                  covered += int(true_count > 0) + int(false_execution_count > 0)
              return covered, total

          def merged_branch_totals(source_functions, selected_lines):
              branches = {}
              for function, file_id in source_functions:
                  for branch in function.get("branches", []):
                      if (len(branch) < 6
                              or (len(branch) > 6 and branch[6] != file_id)
                              or branch[0] not in selected_lines):
                          continue
                      true_count, false_count = branch[4], branch[5]
                      if (not isinstance(true_count, int) or not isinstance(false_count, int)
                              or true_count < 0 or false_count < 0):
                          raise SystemExit("invalid LLVM branch counters")
                      # Rust emits one function record per monomorphization. Merge
                      # identical source branches so generic/closure instances do
                      # not multiply the changed-file coverage denominator.
                      coordinate = tuple(branch[:4])
                      counts = branches.setdefault(coordinate, [0, 0])
                      counts[0] += true_count
                      counts[1] += false_count
              covered = sum(int(true_count > 0) + int(false_count > 0)
                  for true_count, false_count in branches.values())
              return covered, 2 * len(branches)

          duplicate_branch = {"branches": [[2, 1, 2, 8, 1, 0, 0], [2, 1, 2, 8, 0, 1, 0]]}
          if merged_branch_totals([(duplicate_branch, 0)], {2}) != (2, 2):
              raise SystemExit("LLVM duplicate-branch coordinate self-check failed")

          critical = []
          for name in names:
              matches = [function for function in functions if test_file in normalized_files(function) and function["name"].endswith(name)]
              if len(matches) != 1 or matches[0].get("count") != 1:
                  raise SystemExit(f"missing/ambiguous/unexecuted critical selector: {name}")
              file_id = normalized_files(matches[0]).index(test_file)
              critical_lines = region_line_counts(matches[0], file_id)
              line_covered = sum(any(value > 0 for value in counts) for counts in critical_lines.values())
              line_total = len(critical_lines)
              if line_total == 0 or line_covered != line_total:
                  raise SystemExit(f"critical line coverage is not 100%: {name}")
              branch_covered, branch_total = branch_totals(matches[0], file_id=file_id)
              if branch_total and branch_covered != branch_total:
                  raise SystemExit(f"critical branch coverage is not 100%: {name}")
              critical.append({"file": test_file, "name": name,
                  "line_covered": line_covered, "line_total": line_total,
                  "branch_covered": branch_covered, "branch_total": branch_total,
                  "branch_status": "covered" if branch_total else "not_applicable"})

          diff = subprocess.check_output(["git", "diff", "--unified=0", f"{base}..{head}", "--", "*.rs"], text=True)
          changed, current = {}, None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  current = line[6:]
              elif line.startswith("+++ /dev/null"):
                  current = None
              elif current is not None and line.startswith("@@"):
                  match = re.search(r"\+(\d+)(?:,(\d+))?", line)
                  start, count = int(match.group(1)), int(match.group(2) or 1)
                  changed.setdefault(current, set()).update(range(start, start + count))
          attributed = {filename for function in functions for filename in normalized_files(function)}
          unmeasured = sorted(path for path, lines in changed.items()
              if lines and Path(path).is_file() and path not in attributed)
          if unmeasured:
              raise SystemExit(f"changed Rust files are absent from coverage: {unmeasured}")
          line_total = line_covered = branch_total = branch_covered = 0
          changed_files = []
          for source_file, changed_lines in sorted(changed.items()):
              changed_regions = []
              source_functions = []
              for function in functions:
                  filenames = normalized_files(function)
                  if source_file not in filenames:
                      continue
                  file_id = filenames.index(source_file)
                  source_functions.append((function, file_id))
                  for raw in function.get("regions", []):
                      if len(raw) >= 6 and raw[5] == file_id:
                          remapped = list(raw)
                          remapped[5] = 0
                          changed_regions.append(remapped)
              counts = region_line_counts({"regions": changed_regions})
              executable = set(counts)
              local_lines = changed_lines & executable
              local_line_total = len(local_lines)
              local_line_covered = len({line for line in local_lines
                  if any(value > 0 for value in counts[line])})
              local_branch_covered, local_branch_total = merged_branch_totals(
                  source_functions, local_lines)
              if local_line_total or local_branch_total:
                  changed_files.append(source_file)
              line_total += local_line_total
              line_covered += local_line_covered
              branch_total += local_branch_total
              branch_covered += local_branch_covered
          if not line_total or not branch_total:
              raise SystemExit("changed executable coverage denominator is zero")
          line_percent = 100.0 * line_covered / line_total
          branch_percent = 100.0 * branch_covered / branch_total
          if line_percent < 80.0 or branch_percent < 80.0:
              raise SystemExit(f"changed executable coverage below 80%: line={line_percent:.2f} branch={branch_percent:.2f}")
          summary = {"schema":"gh68-coverage-v1", "head_sha":head, "base_main_sha":base,
              "toolchain":"nightly-2026-01-18", "branch_collection":True,
              "raw_sha256":hashlib.sha256(raw_bytes).hexdigest(),
              "changed_executable":{"files":changed_files,"line_covered":line_covered,"line_total":line_total,
                  "line_percent":line_percent,"branch_covered":branch_covered,"branch_total":branch_total,
                  "branch_percent":branch_percent}, "critical":critical}
          Path(output_path).write_text(json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Bind terminal matrix to current runner and head
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gh68-terminal-evidence.json" "$GH68_IMPLEMENTATION_HEAD" <<'PY'
          import json, platform, subprocess, sys
          from pathlib import Path
          output, head = sys.argv[1:]
          source = Path("docs/TERMINAL_COMPATIBILITY.md").read_text(encoding="utf-8")
          line = next(line for line in source.split("gh68-terminal-matrix-v1", 1)[1].splitlines() if line.startswith("{"))
          matrix = json.loads(line)
          if set(matrix) != {"schema", "cells"} or matrix["schema"] != "gh68-terminal-matrix-v1":
              raise SystemExit("invalid terminal matrix schema")
          cells = matrix["cells"]
          vocabulary = {"verified", "best_effort", "terminal_dependent", "unsupported", "unverified"}
          required = {"os", "terminal_emulator", "inline", "fullscreen", "paste", "resize", "raw_restoration", "tmux", "ssh"}
          if len(cells) != len(required) or {cell.get("id") for cell in cells} != required:
              raise SystemExit("terminal matrix cells are missing or duplicated")
          for cell in cells:
              if set(cell) != {"id", "status", "evidence"} or cell["status"] not in vocabulary or not cell["evidence"]:
                  raise SystemExit("terminal matrix cell is not closed")
              if (cell["status"] == "verified" and cell["evidence"] == "none") or (cell["status"] == "unverified" and cell["evidence"] != "none"):
                  raise SystemExit("terminal matrix status is not bound to evidence")
          rustc = subprocess.check_output(["rustc", "-Vv"], text=True).strip()
          artifact = {"schema":"gh68-terminal-evidence-v1", "head_sha":head,
              "runner":{"os":platform.system(), "arch":platform.machine(), "rustc_vv":rustc}, "cells":cells}
          Path(output).write_text(json.dumps(artifact, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run all fifteen exact GH68 selectors
        shell: bash
        env:
          GH68_COVERAGE_EVIDENCE: ${{ runner.temp }}/gh68-coverage.json
          GH68_COVERAGE_RAW: ${{ runner.temp }}/gh68-coverage-raw.json
          GH68_TERMINAL_EVIDENCE: ${{ runner.temp }}/gh68-terminal-evidence.json
          GH68_BENCHMARK_ROUTE: smoke_blocked_no_baseline
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gh68-selectors.txt" <<'PY'
          import json, sys
          from pathlib import Path
          source = Path("specs/GH68/tasks.md").read_text(encoding="utf-8")
          line = next(line for line in source.split("gh68-critical-paths-v1", 1)[1].splitlines() if line.startswith("{"))
          items = json.loads(line)["critical_paths"]
          names = [item["name"] for item in items]
          if len(names) != 15 or len(set(names)) != 15:
              raise SystemExit("critical selector set is not exactly 15 unique names")
          Path(sys.argv[1]).write_text("\n".join(names) + "\n", encoding="utf-8")
          PY
          : > "$RUNNER_TEMP/gh68-exact-results.log"
          while IFS= read -r selector; do
            listed="$(cargo test --test golden_real_apps --all-features --locked "$selector" -- --list --exact)"
            test "$(printf '%s\n' "$listed" | grep -Fxc "$selector: test")" -eq 1
            output="$(cargo test --test golden_real_apps --all-features --locked "$selector" -- --exact 2>&1)"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -F "test result: ok. 1 passed; 0 failed; 0 ignored;"
            printf '%s matched=1 passed=1 ignored=0\n' "$selector" >> "$RUNNER_TEMP/gh68-exact-results.log"
          done < "$RUNNER_TEMP/gh68-selectors.txt"

      - name: Run complete GH68 target and documentation links
        shell: bash
        env:
          GH68_COVERAGE_EVIDENCE: ${{ runner.temp }}/gh68-coverage.json
          GH68_COVERAGE_RAW: ${{ runner.temp }}/gh68-coverage-raw.json
          GH68_TERMINAL_EVIDENCE: ${{ runner.temp }}/gh68-terminal-evidence.json
          GH68_BENCHMARK_ROUTE: smoke_blocked_no_baseline
        run: |
          set -euo pipefail
          cargo test --test golden_real_apps --all-features --locked
          python3 .github/scripts/check_markdown_links.py \
            examples/README.md docs/API_STABILITY.md docs/CHAT_QUICKSTART.md \
            docs/TERMINAL_COMPATIBILITY.md specs/GH68

      - name: Run deterministic GH68 benchmark smoke
        run: |
          set -euo pipefail
          cargo bench --bench render --no-run --locked
          cargo bench --bench render --locked -- gh68 --test
          printf '{"schema":"gh68-benchmark-status-v1","head_sha":"%s","route":"smoke_blocked_no_baseline","route_status":"valid","performance_status":"not_available","reason":"approved_baseline_unavailable"}\n' \
            "$GH68_IMPLEMENTATION_HEAD" > "$RUNNER_TEMP/gh68-benchmark-status.json"
          echo "GH68 benchmark smoke completed; this is not a performance pass."

      - name: Bind evidence digests after all required checks
        shell: bash
        run: |
          set -euo pipefail
          printf 'head_sha=%s\nbase_main_sha=%s\n' \
            "$GH68_IMPLEMENTATION_HEAD" "$GH68_BASE_MAIN_SHA" \
            > "$RUNNER_TEMP/gh68-head-binding.txt"
          sha256sum "$RUNNER_TEMP/gh68-coverage-raw.json" \
            "$RUNNER_TEMP/gh68-coverage.json" \
            "$RUNNER_TEMP/gh68-exact-results.log" \
            "$RUNNER_TEMP/gh68-terminal-evidence.json" \
            "$RUNNER_TEMP/gh68-benchmark-status.json" \
            "$RUNNER_TEMP/gh68-head-binding.txt" \
            > "$RUNNER_TEMP/gh68-evidence-sha256.txt"

      - name: Upload validated GH68 evidence
        id: gh68_upload
        uses: actions/upload-artifact@v4
        with:
          name: gh68-current-head-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          overwrite: false
          path: |
            ${{ runner.temp }}/gh68-coverage-raw.json
            ${{ runner.temp }}/gh68-coverage.json
            ${{ runner.temp }}/gh68-exact-results.log
            ${{ runner.temp }}/gh68-terminal-evidence.json
            ${{ runner.temp }}/gh68-benchmark-status.json
            ${{ runner.temp }}/gh68-head-binding.txt
            ${{ runner.temp }}/gh68-evidence-sha256.txt

      - name: Verify immutable artifact receipt
        env:
          GH68_ARTIFACT_ID: ${{ steps.gh68_upload.outputs.artifact-id }}
          GH68_ARTIFACT_DIGEST: ${{ steps.gh68_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$GH68_ARTIFACT_ID"
          digest="${GH68_ARTIFACT_DIGEST#sha256:}"
          printf '%s\n' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          printf 'sha256:%s\n' "$digest" > "$RUNNER_TEMP/gh68-artifact-digest.txt"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
      - workspace
      - msrv
      - feature-matrix
      - clippy
      - fmt
      - docs
      - doc-tests
      - gh68
    steps:
      - name: Required checks passed
        run: echo "Required CI checks passed"
