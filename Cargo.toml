[workspace]
members = [".", "crates/rnk-style", "crates/rnk-style-core", "crates/rnk-icons"]

[package]
name = "rnk"
version = "0.19.3"
edition = "2024"
rust-version = "1.88"
description = "A React-like declarative terminal UI framework for Rust, inspired by Ink and Bubbletea"
license = "MIT"
repository = "https://github.com/majiayu000/rnk"
homepage = "https://github.com/majiayu000/rnk"
documentation = "https://docs.rs/rnk"
readme = "README.md"
keywords = ["tui", "terminal", "ui", "cli", "react"]
categories = ["command-line-interface", "gui"]
authors = ["majiayu000 <1835304752@qq.com>"]
exclude = [
    "AGENTS.md",
    "CLAUDE.md",
    "docs/*",
    "specs/*",
    ".github/*",
    ".claude/*",
    "video/*",
    "Cargo.toml.orig",
    "DESIGN_ISSUES.md",
]

[lib]
name = "rnk"
path = "src/lib.rs"

[[bin]]
name = "rnk"
path = "src/main.rs"

[features]
default = []
testing = []  # Enable testing utilities in release builds
http = ["dep:reqwest"]

[dependencies]
# Layout engine
taffy = "0.7"

# Terminal operations
crossterm = "0.28"

# Unicode width calculation
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Text wrapping
textwrap = "0.16"

# Logging
log = "0.4"

# Signal handling
ctrlc = { version = "3.4", features = ["termination"] }

# Async runtime for Command system
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "process"] }

# HTTP client (optional)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Directory paths
dirs-next = "2.0"

# Unix-specific dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The PTY integration test reads the pty's termios directly, which is a Unix
# concept, so both of these stay off the Windows build entirely.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
portable-pty = "0.9"      # Drive a real terminal in tests

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1.4"  # Property-based testing
divan = "0.1"     # Benchmarking
trybuild = "1"    # Compile-fail contracts for immutable public APIs

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "message_list"
harness = false

[[bench]]
name = "chat_scrollback"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "unicode"
harness = false

[[bench]]
name = "hooks"
harness = false

# Examples are discovered automatically from examples/*.rs.
# Keep Cargo.toml free of explicit [[example]] entries to avoid drift.
